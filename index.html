<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GYMTRACKER - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1 style="font-size: 42px; margin-bottom: 10px; letter-spacing: 2px;">
      LIFTR
    </h1>

    <!-- LOGIN CARD -->
    <div class="card" id="loginCard">
      <h2 style="margin-bottom: 10px;">Login</h2>
      <form id="loginForm">
        <input type="email" id="loginUser" placeholder="Email" required>
        <input type="password" id="loginPass" placeholder="Password" required>

        <button type="submit">Login</button>
      </form>

      <p style="text-align:center; margin-top:10px; font-size:14px;">
        Don’t have an account?
        <span style="color:#4da6ff; cursor:pointer;" onclick="showRegister()">Click here to register</span>
      </p>
    </div>

    <!-- REGISTER CARD (hidden by default) -->
    <div class="card" id="registerCard" style="display:none;">
      <h2 style="margin-bottom: 10px;">Register</h2>
      <form id="registerForm">
        <input type="email" id="regUser" placeholder="Email" required>
        <input type="password" id="regPass" placeholder="Password" required>

        <button type="submit">Create Account</button>
      </form>

      <p style="text-align:center; margin-top:10px; font-size:14px;">
        Already have an account?
        <span style="color:#4da6ff; cursor:pointer;" onclick="showLogin()">Click here to login</span>
      </p>
    </div>

  </div>

  <script src="app.js"></script>

  <script>
    function showRegister() {
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("registerCard").style.display = "block";
    }

    function showLogin() {
      document.getElementById("registerCard").style.display = "none";
      document.getElementById("loginCard").style.display = "block";
    }
  </script>

</body>
</html>
