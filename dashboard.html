<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Workouts</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="apple-touch-icon" href="image.png">
</head>
<body>

  <!-- Hamburger Menu Icon -->
  <div id="hamburger" class="hamburger">
    ☰
  </div>

  <!-- Slide-Out Menu -->
  <div id="sideMenu" class="side-menu">
    <h3>Menu</h3>
    <ul>
      <li onclick="openPersonalBests()">Personal Bests</li>
      <li onclick="openSettings()">Settings</li>
      <li onclick="logout()">Logout</li>
    </ul>
  </div>

  <div class="container">

    <h1 style="font-size: 36px; margin-bottom: 10px; letter-spacing: 1px;">
      Welcome!
    </h1>

    <form id="exerciseForm" class="card">

      <select id="exerciseSelect">
        <option value="">-- Select Exercise --</option>
      </select>

      <input type="text" id="newExercise" placeholder="Or type a new exercise">

      <input type="number" step="0.01" id="weight" placeholder="Weight" required>
      <input type="number" id="reps" placeholder="Reps" required>

      <button type="submit">Add Set</button>
    </form>

    <!-- Workout Dates Section -->
    <h2 style="margin-top: 30px; margin-bottom: 10px;">
      Workout Dates
    </h2>

    <!-- Date selector for viewing daily workouts -->
    <input type="date" id="viewDate" onchange="viewSelectedDate()">

    <!-- This will show clickable workout dates -->
    <div id="exerciseList"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
